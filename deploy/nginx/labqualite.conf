# Reverse proxy TLS devant Gunicorn. Certificats Let's Encrypt montés dans /etc/nginx/certs
# (fullchain.pem, privkey.pem), obtenus par exemple avec certbot en mode webroot (/var/www/acme).
server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Taille maximale des pièces jointes (15 Mo par défaut côté application) + marge.
    client_max_body_size 17m;
    server_tokens off;

    location /static/ {
        proxy_pass http://app:8000;
        expires 7d;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 90s;
    }
}
