# Production : à combiner avec docker-compose.yml
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Toutes les valeurs sensibles viennent du fichier .env du serveur (jamais versionné).
services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      LABQ_OWNER_PASSWORD: ${LABQ_OWNER_PASSWORD:?LABQ_OWNER_PASSWORD requis}
      LABQ_APP_PASSWORD: ${LABQ_APP_PASSWORD:?LABQ_APP_PASSWORD requis}
    ports: []

  app:
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY requis}
      BASE_URL: ${BASE_URL:?BASE_URL requis}
      MAIL_BACKEND: smtp
      LOG_JSON: "true"
      FORWARDED_ALLOW_IPS: "*"
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-fr-par}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      INVOICE_ISSUER_NAME: ${INVOICE_ISSUER_NAME:-}
      INVOICE_ISSUER_SIRET: ${INVOICE_ISSUER_SIRET:-}
      INVOICE_ISSUER_ADDRESS: ${INVOICE_ISSUER_ADDRESS:-}
      VAT_EXEMPTION_MENTION: ${VAT_EXEMPTION_MENTION:-TVA non applicable, art. 293 B du CGI}
      GRACE_DAYS: ${GRACE_DAYS:-14}
    ports: !reset []
    expose:
      - "8000"

  scheduler:
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY requis}
      BASE_URL: ${BASE_URL:?BASE_URL requis}
      MAIL_BACKEND: smtp
      LOG_JSON: "true"
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/labqualite.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./deploy/nginx/certs}:/etc/nginx/certs:ro
      - ./deploy/nginx/acme:/var/www/acme:ro

  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: labq_owner
      PGPASSWORD: ${LABQ_OWNER_PASSWORD:?LABQ_OWNER_PASSWORD requis}
      PGDATABASE: labqualite
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    entrypoint: ["/bin/sh", "/backup.sh"]
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
