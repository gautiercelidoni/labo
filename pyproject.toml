[project]
name = "labqualite"
version = "1.0.0"
description = "SaaS de gestion qualité pour petits laboratoires ISO/IEC 17025"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.3",
    "Flask-SQLAlchemy==3.1.1",
    "SQLAlchemy==2.0.54",
    "Flask-Migrate==4.1.0",
    "alembic==1.20.0",
    "Flask-Login==0.6.3",
    "Flask-WTF==1.3.0",
    "WTForms==3.2.2",
    "email-validator==2.3.0",
    "psycopg[binary]==3.3.6",
    "argon2-cffi==25.1.0",
    "stripe==15.6.1",
    "weasyprint==70.0",
    "python-magic==0.4.27",
    "boto3==1.43.99",
    "gunicorn==26.2.0",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "factory-boy==3.3.3",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:weasyprint.*"]
