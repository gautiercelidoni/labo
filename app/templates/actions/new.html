{% extends "base.html" %}
{% from "_macros.html" import field %}
{% block title %}Nouvelle action corrective{% endblock %}
{% block content %}
<section class="card medium">
  <h1>Nouvelle action corrective</h1>
  <form method="post" novalidate>{{ form.hidden_tag() }}{{ field(form.description) }}
    <div class="row">{{ field(form.responsible_id) }}{{ field(form.due_on) }}</div>
    <button type="submit">Créer</button></form>
</section>
{% endblock %}
